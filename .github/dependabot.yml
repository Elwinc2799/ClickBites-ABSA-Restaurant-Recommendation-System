version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      # Transformers 5.x is still release-candidate only. A major-version jump
      # risks breaking our fine-tuned BERT inference on the HF Space. Re-enable
      # once transformers 5.0.0 ships stable.
      - dependency-name: "transformers"
        versions: ["5.x"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
